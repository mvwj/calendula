name: Publication safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  review:
    name: Source and secret checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check publication file guard
        run: |
          python3 scripts/check-publication.py --history
          python3 -m unittest discover -s tests -p test_publication_guard.py
      - name: Install checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  '"$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full reachable history with redacted output
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner --log-level warn'
      - name: Check core logic
        run: node --test tests/*.test.mjs
