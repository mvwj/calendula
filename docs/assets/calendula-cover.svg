<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Calendula — Your day, with room to breathe.</title>
  <desc id="desc">Cream, forest green and orange illustration of a native day calendar and transport widget. All appointments are fictional.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DCD8CB"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#183E2D" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1440" height="820" rx="32" fill="#F5F1E8"/>
  <rect width="1440" height="820" rx="32" fill="url(#grid)" opacity=".5"/>
  <circle cx="1340" cy="68" r="250" fill="#E8EADD"/>
  <circle cx="1380" cy="820" r="290" fill="#EEDBC0" opacity=".55"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(72 74)">
      <path d="M20 42V22" stroke="#315742" stroke-width="5" stroke-linecap="round"/>
      <path d="M20 36C7 37 5 25 5 25C17 24 20 31 20 36M20 42C33 42 35 31 35 31C23 30 20 36 20 42" fill="#315742"/>
      <g fill="#D79246"><ellipse cx="20" cy="9" rx="6" ry="10"/><ellipse cx="20" cy="9" rx="6" ry="10" transform="rotate(60 20 16)"/><ellipse cx="20" cy="9" rx="6" ry="10" transform="rotate(120 20 16)"/></g>
      <circle cx="20" cy="16" r="5" fill="#F5D497"/>
      <text x="56" y="35" font-size="35" font-weight="650" letter-spacing="-1.4" fill="#203D30">calendula</text>
    </g>
    <text x="78" y="230" font-size="13" font-weight="600" letter-spacing="3" fill="#7D806E">A LITTLE SPACE FOR YOUR DAY</text>
    <text x="72" y="314" font-size="66" font-weight="600" letter-spacing="-3" fill="#203D30">Your day,</text>
    <text x="72" y="394" font-size="66" font-weight="600" letter-spacing="-3" fill="#203D30">with room</text>
    <text x="72" y="474" font-size="66" font-weight="600" letter-spacing="-3" fill="#203D30">to breathe.</text>
    <text x="78" y="532" font-size="21" fill="#627061">A private calendar. A thoughtful journey.</text>
    <g transform="translate(78 584)">
      <rect width="226" height="43" rx="21" fill="#E5E8DB"/>
      <circle cx="23" cy="21" r="4" fill="#315742"/>
      <text x="38" y="28" font-size="14" font-weight="600" fill="#315742">Android + Windows</text>
    </g>
    <text x="78" y="744" font-size="13" letter-spacing="1.5" fill="#78826F">LOCAL FIRST   /   PRAGUE TRANSIT   /   NO CALENDAR ACCOUNT</text>
    <g filter="url(#shadow)">
      <rect x="624" y="90" width="488" height="630" rx="26" fill="#FFFCF6" stroke="#E1DFD2"/>
      <rect x="624" y="90" width="488" height="46" rx="26" fill="#EBEDE1"/>
      <rect x="624" y="113" width="488" height="23" fill="#EBEDE1"/>
      <g fill="#B8BFAE"><circle cx="650" cy="113" r="4"/><circle cx="665" cy="113" r="4"/><circle cx="680" cy="113" r="4"/></g>
      <text x="854" y="118" font-size="11" fill="#75836D" text-anchor="middle">calendula</text>
      <text x="660" y="186" font-size="11" letter-spacing="2.2" fill="#8A8B77">YOUR DAY</text>
      <text x="660" y="229" font-size="30" font-weight="600" letter-spacing="-.8" fill="#203D30">Thursday, 15 October</text>
      <text x="660" y="261" font-size="14" fill="#7A8373">Everything in its own good time.</text>
      <g font-size="12" text-anchor="middle" fill="#7D8675">
        <text x="681" y="310">M</text><text x="745" y="310">T</text><text x="809" y="310">W</text>
        <rect x="848" y="286" width="49" height="66" rx="22" fill="#315742"/>
        <text x="873" y="310" fill="#FFFFFF">T</text><text x="937" y="310">F</text><text x="1001" y="310">S</text><text x="1065" y="310">S</text>
        <g font-size="18"><text x="681" y="338">12</text><text x="745" y="338">13</text><text x="809" y="338">14</text><text x="873" y="338" fill="#FFFFFF">15</text><text x="937" y="338">16</text><text x="1001" y="338">17</text><text x="1065" y="338">18</text></g>
      </g>
      <g transform="translate(659 379)">
        <rect width="418" height="126" rx="18" fill="#E9EEDF"/>
        <rect x="0" y="18" width="4" height="87" rx="2" fill="#8A9B6F"/>
        <text x="22" y="28" font-size="11" letter-spacing="1.5" fill="#738369">10:30 — 12:00</text>
        <text x="22" y="58" font-size="21" font-weight="600" fill="#294936">Design studio</text>
        <text x="22" y="83" font-size="13" fill="#75836D">Workshop · Room 2 · City centre</text>
        <text x="22" y="108" font-size="12" font-weight="600" fill="#315742">Leave 09:55 · arrive 10 min early</text>
      </g>
      <g transform="translate(659 522)">
        <rect width="418" height="101" rx="18" fill="#F3E9D9"/>
        <rect x="0" y="18" width="4" height="65" rx="2" fill="#D79246"/>
        <text x="22" y="28" font-size="11" letter-spacing="1.5" fill="#9E855E">14:00 — 15:00</text>
        <text x="22" y="58" font-size="21" font-weight="600" fill="#554932">A little time to read</text>
        <text x="22" y="83" font-size="13" fill="#99866A">Library · Personal</text>
      </g>
      <path d="M659 655H1077" stroke="#E5E4D8"/>
      <text x="675" y="687" font-size="13" font-weight="600" fill="#315742">Calendar</text><text x="810" y="687" font-size="13" fill="#969D8B">Transport</text><text x="951" y="687" font-size="13" fill="#969D8B">Sources</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1002" y="373" width="372" height="309" rx="24" fill="#284B3D" stroke="#52705D"/>
      <text x="1029" y="408" font-size="11" letter-spacing="2.5" fill="#EDAA65">✿  CALENDULA</text>
      <text x="1029" y="444" font-size="22" font-weight="500" fill="#FFFFFF">Your next journey</text>
      <text x="1029" y="492" font-size="31" font-weight="600" letter-spacing="-1" fill="#FFFFFF">Leave at 09:55</text>
      <text x="1029" y="519" font-size="14" fill="#CAD9CA">25 min · arrive 10 min early</text>
      <path d="M1029 543H1346" stroke="#56725F"/>
      <text x="1029" y="571" font-size="14" fill="#F2C18C">10:30  Design studio</text>
      <text x="1029" y="598" font-size="13" fill="#D8E2D4">Walk → tram → walk</text>
      <text x="1029" y="649" font-size="11" fill="#AABFAA">ILLUSTRATIVE PLANS · NOT A LIVE ROUTE</text>
    </g>
  </g>
</svg>
